[project]
name = "prelegal-backend"
version = "0.1.0"
description = "FastAPI backend for the Prelegal V1 foundation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
package = false
